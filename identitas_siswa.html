<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulir Identitas Siswa</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 30px 15px; font-family: Arial, sans-serif;
      background: #f1f5f9; color: #1e293b;
    }
    .container {
      max-width: 520px; margin: auto; background: #fff; padding: 26px;
      border-radius: 12px; box-shadow: 0 4px 18px rgba(15, 23, 42, .08);
    }
    h1 { margin: 0 0 8px; font-size: 24px; text-align: center; }
    .subtitle { text-align: center; color: #64748b; margin: 0 0 24px; }
    label { display: block; margin: 16px 0 7px; font-weight: 700; }
    input, select, button {
      width: 100%; padding: 12px; border-radius: 7px; font-size: 15px;
    }
    input, select { border: 1px solid #cbd5e1; background: #fff; }
    select:disabled { background: #e2e8f0; cursor: not-allowed; }
    button {
      margin-top: 22px; border: 0; background: #2563eb; color: #fff;
      font-weight: 700; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .hint { margin: 7px 0 0; color: #64748b; font-size: 13px; }
    .result, .error {
      margin-top: 22px; padding: 16px; border-radius: 8px;
    }
    .result { background: #eff6ff; border: 1px solid #bfdbfe; }
    .result h2 { margin: 0 0 12px; font-size: 19px; color: #1d4ed8; }
    .result p { margin: 8px 0; overflow-wrap: anywhere; }
    .error { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <main class="container">
    <h1>Formulir Identitas Siswa</h1>
    <p class="subtitle">Silakan isi data siswa di bawah ini.</p>

    <form id="formIdentitas">
      <label for="nama">Nama Lengkap</label>
      <input type="text" id="nama" name="nama" maxlength="100"
             placeholder="Masukkan nama lengkap" required>

      <label for="jurusan">Jurusan</label>
      <select id="jurusan" name="jurusan" required>
        <option value="">-- Pilih Jurusan --</option>
        <option value="RPL">Rekayasa Perangkat Lunak (RPL)</option>
        <option value="TKJ">Teknik Komputer dan Jaringan (TKJ)</option>
        <option value="DKV">Desain Komunikasi Visual (DKV)</option>
      </select>

      <label for="kelas">Kelas</label>
      <select id="kelas" name="kelas" required disabled>
        <option value="">-- Pilih Jurusan Terlebih Dahulu --</option>
      </select>
      <p class="hint">Pilihan kelas akan menyesuaikan jurusan yang dipilih.</p>

      <button type="submit">Kirim Data</button>
    </form>

    <div id="pesan" aria-live="polite"></div>
  </main>

  <script>
    // Ubah daftar ini sesuai kelas yang tersedia di sekolah.
    const daftarKelas = {
      RPL: ["XII RPL 1", "XII RPL 2"],
      TKJ: ["XII TKJ 1", "XII TKJ 2"],
      DKV: ["XII DKV 1", "XII DKV 2"]
    };

    const namaJurusan = {
      RPL: "Rekayasa Perangkat Lunak",
      TKJ: "Teknik Komputer dan Jaringan",
      DKV: "Desain Komunikasi Visual"
    };

    const form = document.getElementById("formIdentitas");
    const jurusanSelect = document.getElementById("jurusan");
    const kelasSelect = document.getElementById("kelas");
    const pesan = document.getElementById("pesan");

    function perbaruiKelas() {
      const jurusan = jurusanSelect.value;
      kelasSelect.replaceChildren();

      const opsiAwal = document.createElement("option");
      opsiAwal.value = "";
      opsiAwal.textContent = jurusan
        ? "-- Pilih Kelas --"
        : "-- Pilih Jurusan Terlebih Dahulu --";
      kelasSelect.appendChild(opsiAwal);

      if (!jurusan || !daftarKelas[jurusan]) {
        kelasSelect.disabled = true;
        return;
      }

      daftarKelas[jurusan].forEach((namaKelas) => {
        const opsi = document.createElement("option");
        opsi.value = namaKelas;
        opsi.textContent = namaKelas;
        kelasSelect.appendChild(opsi);
      });

      kelasSelect.disabled = false;
    }

    jurusanSelect.addEventListener("change", () => {
      perbaruiKelas();
      pesan.replaceChildren();
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      pesan.replaceChildren();

      const nama = document.getElementById("nama").value.trim();
      const jurusan = jurusanSelect.value;
      const kelas = kelasSelect.value;

      // Validasi di sisi browser. Ini bukan penyimpanan ke server/database.
      if (!nama || nama.length > 100) {
        tampilkanPesan("Nama wajib diisi dan maksimal 100 karakter.", "error");
        return;
      }

      if (!daftarKelas[jurusan] || !daftarKelas[jurusan].includes(kelas)) {
        tampilkanPesan("Jurusan atau kelas tidak valid. Silakan pilih kembali.", "error");
        return;
      }

      const hasil = document.createElement("section");
      hasil.className = "result";

      const judul = document.createElement("h2");
      judul.textContent = "Data Berhasil Dikirim!";
      hasil.appendChild(judul);

      [
        ["Nama", nama],
        ["Jurusan", namaJurusan[jurusan]],
        ["Kelas", kelas]
      ].forEach(([label, nilai]) => {
        const baris = document.createElement("p");
        const kuat = document.createElement("strong");
        kuat.textContent = label + ": ";
        baris.appendChild(kuat);
        baris.appendChild(document.createTextNode(nilai));
        hasil.appendChild(baris);
      });

      pesan.appendChild(hasil);
    });

    function tampilkanPesan(teks, jenis) {
      const elemen = document.createElement("div");
      elemen.className = jenis;
      elemen.textContent = teks;
      pesan.appendChild(elemen);
    }
  </script>
</body>
</html>
